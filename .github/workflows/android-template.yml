name: Android Template Build

# Mantém vendor/android/template.{aab,apk} atualizados a partir do projeto
# android-template/. Esses arquivos são consumidos pelo pipeline front-end
# (packages/android/exportadorAndroid.js), tanto na versão web (GitHub Pages)
# quanto no app desktop (Tauri empacota vendor/ inteiro em dist-desktop/).

on:
  push:
    branches: [main]
    paths:
      - 'android-template/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install Android SDK platform + build-tools
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
            "platforms;android-34" \
            "build-tools;34.0.0" 2>/dev/null || true

      - name: Setup Gradle 8.13 (sem wrapper jar)
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.13"

      - name: Build template (AAB + APK debug — mesmo formato do build local)
        working-directory: android-template
        run: gradle :app:bundleDebug :app:assembleDebug

      - name: Copiar template.aab e template.apk para vendor/android
        run: |
          cp android-template/app/build/outputs/bundle/debug/app-debug.aab vendor/android/template.aab
          cp android-template/app/build/outputs/apk/debug/app-debug.apk    vendor/android/template.apk

      - name: Commitar templates atualizados
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- vendor/android/template.aab vendor/android/template.apk; then
            echo "Templates inalterados, nada para commitar."
            exit 0
          fi
          git add vendor/android/template.aab vendor/android/template.apk
          git commit -m "chore: atualizar template Android em vendor/"
          git push
