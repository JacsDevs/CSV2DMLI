<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ metadados.html }}</title>
    <!-- Fontes e ícones inline (sem CDN externo — compatível com APK offline) -->
    <style>
        /* ===== MATERIAL DESIGN TOKENS ===== */
        {{ estilos_globais }}

        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Roboto', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
            background: var(--cor-fundo);
            color: var(--cor-texto);
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
        }

        /* ===== TOP APP BAR ===== */
        .app-bar {
            position: fixed;
            top: 0; left: 0; right: 0;
            height: 64px;
            background: var(--cor-primaria);
            color: #fff;
            display: flex;
            align-items: center;
            padding: 0 24px;
            z-index: 1200;
            box-shadow: var(--sombra-2);
        }
        .app-bar-toggle {
            display: none;
            background: none;
            border: none;
            color: #fff;
            font-size: 1.5rem;
            cursor: pointer;
            margin-right: 16px;
            width: 40px; height: 40px;
            border-radius: 50%;
            transition: var(--transicao);
        }
        .app-bar-toggle:hover { background: rgba(255,255,255,0.12); }
        .app-bar h1 {
            font-size: 1.25rem;
            font-weight: 600;
            letter-spacing: 0.3px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .app-bar .app-bar-meta {
            margin-left: auto;
            font-size: 0.8rem;
            opacity: 0.85;
            white-space: nowrap;
        }

        /* ===== SIDEBAR ===== */
        .sidebar {
            position: fixed;
            top: 64px;
            left: 0;
            width: var(--sidebar-w);
            height: calc(100vh - 64px);
            background: var(--cor-primaria-light);
            border-right: 1px solid var(--cor-borda);
            z-index: 1050;
            overflow-y: auto;
            padding: 24px 20px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .sidebar-overlay {
            position: fixed;
            top: 64px; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.4);
            z-index: 1040;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.3s ease;
        }
        .sidebar-overlay.ativo { opacity: 1; visibility: visible; }

        .sidebar-titulo {
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1.2px;
            color: var(--cor-secundaria);
            padding-bottom: 10px;
            border-bottom: 1px solid rgba(77,70,55,0.2);
        }
        .sidebar .sidebar-section {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .sidebar .sidebar-label {
            font-size: 0.72rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            color: var(--cor-secundaria);
            opacity: 0.7;
        }
        .sidebar .busca-wrapper {
            display: flex;
            flex-direction: column;
            gap: 8px;
            min-width: unset;
        }
        .sidebar .busca-wrapper input {
            width: 100%;
            padding: 10px 14px;
            border: 1px solid rgba(77,70,55,0.25);
            border-radius: var(--raio);
            font-size: 0.9rem;
            background: rgba(255,255,255,0.7);
            transition: var(--transicao);
        }
        .sidebar .busca-wrapper input:focus {
            outline: none;
            border-color: var(--cor-primaria);
            background: #fff;
            box-shadow: 0 0 0 3px rgba(29,133,99,0.18);
        }
        .sidebar .busca-wrapper button {
            width: 100%;
            padding: 10px 16px;
            background: var(--cor-primaria);
            color: #fff;
            border: none;
            border-radius: var(--raio);
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transicao);
            box-shadow: var(--sombra-1);
        }
        .sidebar .busca-wrapper button:hover {
            background: var(--cor-primaria-dark);
            box-shadow: var(--sombra-2);
        }
        .sidebar .filtro-select {
            width: 100%;
            padding: 9px 12px;
            border: 1px solid rgba(77,70,55,0.25);
            border-radius: var(--raio);
            background: rgba(255,255,255,0.7);
            font-size: 0.85rem;
            cursor: pointer;
            transition: var(--transicao);
        }
        .sidebar .filtro-select:focus {
            outline: none;
            border-color: var(--cor-primaria);
            background: #fff;
        }
        .sidebar .ordenacao {
            margin-left: 0;
            display: flex;
            align-items: center;
        }
        .sidebar .ordenacao label {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            font-size: 0.88rem;
            color: var(--cor-texto);
        }
        .sidebar .contador {
            background: rgba(255,255,255,0.55);
            color: var(--cor-secundaria);
            padding: 10px 14px;
            border-radius: var(--raio);
            font-weight: 600;
            font-size: 0.9rem;
            text-align: center;
            border: 1px solid rgba(77,70,55,0.12);
        }
        .sidebar .contador .progresso {
            font-weight: 400;
            font-size: 0.72rem;
            color: rgba(77,70,55,0.6);
            margin-top: 4px;
        }

        /* ===== MAIN CONTENT ===== */
        .conteudo-principal {
            margin-left: var(--sidebar-w);
            margin-top: 64px;
            padding: 28px 32px;
            min-height: calc(100vh - 64px);
            transition: margin-left 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .cabecalho { margin-bottom: 28px; }
        .cabecalho h1 {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--cor-primaria);
            margin-bottom: 6px;
        }
        .cabecalho .meta {
            display: flex;
            flex-wrap: wrap;
            gap: 16px;
            color: rgba(62,58,50,0.65);
            font-size: 0.85rem;
        }
        .introducao {
            margin-top: 14px;
            padding-top: 14px;
            border-top: 1px solid var(--cor-borda);
            color: rgba(62,58,50,0.7);
            font-size: 0.9rem;
        }

        /* ===== CARDS GRID ===== */
        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 16px;
            margin-bottom: 16px;
        }
        .card {
            background: var(--cor-card);
            border-radius: var(--raio);
            box-shadow: var(--sombra-1);
            border: 1px solid var(--cor-borda);
            transition: var(--transicao);
            cursor: pointer;
            display: flex;
            padding: 16px;
            gap: 14px;
            align-items: flex-start;
        }
        .card:hover {
            transform: translateY(-2px);
            box-shadow: var(--sombra-3);
            border-color: var(--cor-primaria);
        }
        .card-info { flex: 1; min-width: 0; }
        .card-lexical {
            font-size: 1.15rem;
            font-weight: 700;
            color: var(--cor-primaria);
            margin-bottom: 2px;
            word-break: break-word;
        }
        .card-traducao {
            font-size: 0.9rem;
            color: rgba(62,58,50,0.7);
            margin-bottom: 6px;
            word-break: break-word;
        }
        .card-classe {
            display: inline-block;
            background: rgba(29,133,99,0.1);
            color: var(--cor-primaria);
            padding: 2px 10px;
            border-radius: 12px;
            font-size: 0.72rem;
            font-weight: 600;
            margin-bottom: 6px;
        }
        .card-midia-indicador {
            display: flex;
            gap: 10px;
            color: rgba(62,58,50,0.5);
            font-size: 0.72rem;
        }
        .card-img-wrapper {
            flex-shrink: 0;
            width: 40%;
            aspect-ratio: 1/1;
            background: #f0edd8;
            border-radius: var(--raio);
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid var(--cor-borda);
        }
        .card-img-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.3s ease;
        }
        .card:hover .card-img-wrapper img { transform: scale(1.05); }

        /* ===== MODAL ===== */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(4px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1300;
            opacity: 0;
            visibility: hidden;
            transition: var(--transicao);
            padding: 20px;
        }
        .modal-overlay.ativo { opacity: 1; visibility: visible; }
        .modal-conteudo {
            background: var(--cor-card);
            border-radius: 12px;
            max-width: 800px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: var(--sombra-modal);
        }
        .modal-header {
            position: sticky;
            top: 0;
            background: var(--cor-card);
            padding: 20px 24px 16px;
            border-bottom: 1px solid var(--cor-borda);
            z-index: 5;
            display: flex;
            align-items: flex-start;
            gap: 16px;
        }
        .modal-header-titulo {
            flex: 1;
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
        }
        .modal-header h2 {
            font-size: 1.6rem;
            font-weight: 700;
            color: var(--cor-primaria);
        }
        .modal-audio-btn {
            background: var(--cor-primaria);
            color: white;
            border: none;
            border-radius: 50%;
            width: 42px; height: 42px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: var(--transicao);
            font-size: 1.1rem;
            flex-shrink: 0;
            box-shadow: var(--sombra-1);
        }
        .modal-audio-btn:hover {
            background: var(--cor-primaria-dark);
            box-shadow: var(--sombra-2);
        }
        .modal-nav { display: flex; gap: 6px; margin-left: auto; }
        .modal-nav-btn {
            background: var(--cor-superficie);
            border: 1px solid var(--cor-borda);
            border-radius: 50%;
            width: 38px; height: 38px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: var(--transicao);
            color: var(--cor-texto);
            font-size: 1.1rem;
        }
        .modal-nav-btn:hover { background: var(--cor-primaria); color: #fff; border-color: var(--cor-primaria); }
        .modal-nav-btn:disabled { opacity: 0.35; cursor: not-allowed; pointer-events: none; }
        .modal-fechar {
            background: none;
            border: none;
            font-size: 1.8rem;
            cursor: pointer;
            color: rgba(62,58,50,0.5);
            padding: 0 6px;
            transition: var(--transicao);
            line-height: 1;
        }
        .modal-fechar:hover { color: var(--cor-primaria); }
        .modal-body { padding: 24px; }

        .detalhe-secao { margin-bottom: 24px; }
        .detalhe-titulo {
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            color: rgba(62,58,50,0.5);
            margin-bottom: 10px;
            border-bottom: 1px solid var(--cor-borda);
            padding-bottom: 6px;
        }
        .detalhe-valor { font-size: 1rem; color: var(--cor-texto); }

        .midia-galeria {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 14px;
            margin-top: 10px;
        }
        .midia-item img, .midia-item video {
            width: 100%;
            border-radius: var(--raio);
            border: 1px solid var(--cor-borda);
        }
        .audio-btn {
            background: var(--cor-superficie);
            border: 1px solid var(--cor-borda);
            border-radius: 20px;
            padding: 8px 16px;
            margin: 4px 4px 4px 0;
            cursor: pointer;
            transition: var(--transicao);
            font-size: 0.85rem;
        }
        .audio-btn:hover { background: var(--cor-primaria); color: #fff; border-color: var(--cor-primaria); }
        .audio-btn i { margin-right: 6px; }

        .exemplo-item {
            background: var(--cor-superficie);
            border-radius: var(--raio);
            padding: 14px;
            margin-bottom: 10px;
            border: 1px solid var(--cor-borda);
        }
        .exemplo-texto { font-style: italic; margin-bottom: 6px; }
        .exemplo-traducao { color: rgba(62,58,50,0.65); }
        .texto-frase {
            margin-bottom: 14px;
            padding-bottom: 14px;
            border-bottom: 1px dashed var(--cor-borda);
        }
        .loading-indicator {
            grid-column: 1 / -1;
            text-align: center;
            padding: 40px;
            color: rgba(62,58,50,0.5);
        }
        .sem-resultados {
            grid-column: 1 / -1;
            text-align: center;
            padding: 60px 20px;
            background: var(--cor-card);
            border-radius: var(--raio);
            border: 1px solid var(--cor-borda);
            box-shadow: var(--sombra-1);
        }
        .texto-muted { color: rgba(62,58,50,0.5); }
        .mb-2 { margin-bottom: 8px; }
        .mt-4 { margin-top: 24px; }
        .midia-item img { cursor: zoom-in; }

        .lightbox-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.92);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 2000;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.2s ease;
            padding: 20px;
        }
        .lightbox-overlay.ativo { opacity: 1; visibility: visible; }
        .lightbox-img {
            max-width: 100%;
            max-height: 90vh;
            object-fit: contain;
            border-radius: var(--raio);
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
        }
        .lightbox-fechar {
            position: absolute;
            top: 16px; right: 20px;
            background: none;
            border: none;
            color: #fff;
            font-size: 2.5rem;
            cursor: pointer;
            line-height: 1;
            opacity: 0.8;
        }
        .lightbox-fechar:hover { opacity: 1; }

        /* ===== VISUALIZAÇÃO LINEAR ===== */
        .grid-container.modo-lista {
            display: flex;
            flex-direction: column;
            gap: 24px;
        }
        .entrada_lexical {
            background: var(--cor-card);
            border-radius: var(--raio);
            padding: 20px;
            box-shadow: var(--sombra-1);
            border: 1px solid var(--cor-borda);
            transition: var(--transicao);
        }
        .entrada_lexical:hover { box-shadow: var(--sombra-2); }
        .palavra_entrada {
            font-size: 1.4rem;
            font-weight: bold;
            color: var(--cor-primaria);
        }
        .entradalex {
            font-size: 1.1rem;
            color: rgba(62,58,50,0.8);
            margin-left: 8px;
        }
        .entradalex i {
            color: var(--cor-primaria-light);
            font-size: 0.95rem;
        }
        .entrada_div {
            margin-top: 16px;
            padding-top: 12px;
            border-top: 1px dashed var(--cor-borda);
        }
        .info_entrada audio {
            margin: 8px 0 16px 0;
            height: 36px;
        }
        .significado-item {
            margin-top: 12px;
            padding-left: 12px;
            border-left: 3px solid var(--cor-primaria-light);
        }

        /* ===== DESKTOP ===== */
        @media (min-width: 769px) {
            .app-bar-toggle { display: none; }
            .sidebar { transform: translateX(0); }
            .sidebar-overlay { display: none !important; }
        }

        /* ===== MOBILE ===== */
        @media (max-width: 768px) {
            .app-bar-toggle { display: flex; }
            .app-bar h1 { font-size: 1rem; }
            .app-bar .app-bar-meta { display: none; }
            .sidebar {
                transform: translateX(-100%);
                box-shadow: var(--sombra-4);
            }
            .sidebar.aberto { transform: translateX(0); }
            .conteudo-principal {
                margin-left: 0;
                padding: 20px 16px;
            }
            .grid-container { grid-template-columns: 1fr 1fr 1fr; }
            .card {
                flex-direction: column-reverse;
                padding: 12px;
            }
            .card-img-wrapper { width: 100%; }
            .modal-header { flex-wrap: wrap; }
            .cabecalho h1 { font-size: 1.2rem; }
        }

        @media (max-width: 640px) {
            .grid-container { grid-template-columns: 1fr 1fr; }
        }

        .barra-controle { display: none; }
    </style>
</head>
<body>
    <header class="app-bar">
        <button class="app-bar-toggle" id="sidebar-toggle" onclick="toggleSidebar()" title="Menu">&#9776;</button>
        <h1>&#128218; {{ metadados.html }}</h1>
        <span class="app-bar-meta">&#128197; Versão {{ metadados.versao }}</span>
    </header>

    <div class="sidebar-overlay" id="sidebar-overlay" onclick="toggleSidebar()"></div>

    <aside class="sidebar" id="sidebar">
        <div class="sidebar-titulo">&#9881; Configurações</div>

        <div class="sidebar-section">
            <div class="sidebar-label">Pesquisa</div>
            <div class="busca-wrapper">
                <input type="text" id="search-input" placeholder="Buscar termo...">
                <button id="search-button">&#128269; Buscar</button>
            </div>
        </div>

        <div class="sidebar-section">
            <div class="sidebar-label">Filtros</div>
            <select id="filtro-semantico" class="filtro-select">
                <option value="">Todos os campos semânticos</option>
            </select>
            <select id="filtro-classe" class="filtro-select">
                <option value="">Todas as classes</option>
            </select>
        </div>

        <div class="sidebar-section">
            <div class="sidebar-label">Ordenação</div>
            <div class="ordenacao">
                <label>
                    <input type="checkbox" id="ordenar-traducao"> Ordenar por tradução
                </label>
            </div>
        </div>

        <div class="sidebar-section">
            <div class="sidebar-label">Visualização</div>
            <div style="display: flex; gap: 8px;">
                <button id="btn-modo-cards" onclick="mudarModoVisualizacao('cards')" class="filtro-select" style="flex: 1; background: var(--cor-primaria); color: white; border: none; font-weight: 600;">&#128241; Cards</button>
                <button id="btn-modo-lista" onclick="mudarModoVisualizacao('lista')" class="filtro-select" style="flex: 1; border: 1px solid var(--cor-borda);">&#128196; Lista</button>
            </div>
        </div>

        <div class="contador" id="contador-itens">
            <span id="loading-count">0</span> itens
            <div id="progresso-carga" class="progresso"></div>
        </div>
    </aside>

    <div class="conteudo-principal" id="conteudo-principal">
        <header class="cabecalho">
            <h1>{{ metadados.html }}</h1>
            <div class="meta">
                <span>{{ metadados.autor }}</span>
                <span>Versão {{ metadados.versao }}</span>
            </div>
            <div class="introducao">
                {{ textos.intro_html | safe }}
            </div>
        </header>

        <div id="grid-container" class="grid-container">
            <div class="loading-indicator">
                &#9203; Carregando dados...
            </div>
        </div>

        <div id="scroll-sentinela" style="height:1px; width:100%;"></div>
    </div>

    <div class="lightbox-overlay" id="lightbox-overlay">
        <button class="lightbox-fechar" id="lightbox-fechar">&times;</button>
        <img class="lightbox-img" id="lightbox-img" src="" alt="">
    </div>

    <div class="modal-overlay" id="modal-detalhes">
        <div class="modal-conteudo">
            <div class="modal-header">
                <div class="modal-header-titulo">
                    <h2 id="modal-titulo"></h2>
                    <button class="modal-audio-btn" id="modal-audio-btn" style="display: none;" title="Ouvir pronúncia">
                        🔊
                    </button>
                </div>
                <div class="modal-nav">
                    <button class="modal-nav-btn" id="modal-anterior" title="Anterior">&#8249;</button>
                    <button class="modal-nav-btn" id="modal-proximo" title="Próximo">&#8250;</button>
                </div>
                <button class="modal-fechar" id="modal-fechar">&times;</button>
            </div>
            <div class="modal-body" id="modal-body"></div>
        </div>
    </div>

    <script>
        // ==============================================
        // SIDEBAR TOGGLE
        // ==============================================
        function toggleSidebar() {
            var sidebar = document.getElementById('sidebar');
            var overlay = document.getElementById('sidebar-overlay');
            var aberto = sidebar.classList.toggle('aberto');
            overlay.classList.toggle('ativo', aberto);
        }

        // ==============================================
        // CONFIGURAÇÕES E VARIÁVEIS GLOBAIS
        // ==============================================
        window.TAMANHO_LOTE = 20;
        let dadosFiltrados = [];
        let itensExibidos = [];
        let ultimoIndiceExibido = 0;
        let carregandoDados = false;
        let modoVisualizacao = 'cards';

        const gridContainer = document.getElementById('grid-container');
        const searchInput = document.getElementById('search-input');
        const searchButton = document.getElementById('search-button');
        const filtroSemantico = document.getElementById('filtro-semantico');
        const filtroClasse = document.getElementById('filtro-classe');
        const ordenarTraducaoCheck = document.getElementById('ordenar-traducao');
        const contadorSpan = document.getElementById('loading-count');
        const progressoDiv = document.getElementById('progresso-carga');
        const modalOverlay = document.getElementById('modal-detalhes');
        const modalTitulo = document.getElementById('modal-titulo');
        const modalAudioBtn = document.getElementById('modal-audio-btn');
        const modalBody = document.getElementById('modal-body');
        const modalFechar = document.getElementById('modal-fechar');
        const modalAnterior = document.getElementById('modal-anterior');
        const modalProximo = document.getElementById('modal-proximo');
        const sentinela = document.getElementById('scroll-sentinela');

        let termoBusca = '';
        let ordenarPorTraducao = false;
        let filtroSemanticoValor = '';
        let filtroClasseValor = '';
        let itemAtualNoModal = null;

        function mudarModoVisualizacao(modo) {
            modoVisualizacao = modo;
            const btnCards = document.getElementById('btn-modo-cards');
            const btnLista = document.getElementById('btn-modo-lista');
            if (modo === 'cards') {
                btnCards.style.background = 'var(--cor-primaria)';
                btnCards.style.color = 'white';
                btnCards.style.border = 'none';
                btnLista.style.background = 'rgba(255,255,255,0.7)';
                btnLista.style.color = 'var(--cor-texto)';
                btnLista.style.border = '1px solid var(--cor-borda)';
                gridContainer.classList.remove('modo-lista');
            } else {
                btnLista.style.background = 'var(--cor-primaria)';
                btnLista.style.color = 'white';
                btnLista.style.border = 'none';
                btnCards.style.background = 'rgba(255,255,255,0.7)';
                btnCards.style.color = 'var(--cor-texto)';
                btnCards.style.border = '1px solid var(--cor-borda)';
                gridContainer.classList.add('modo-lista');
            }
            renderizarCards(itensExibidos, true);
        }

        // ==============================================
        // FUNÇÕES AUXILIARES
        // ==============================================
        function resolverMidia(nomeArquivo, pasta) {
            if (!nomeArquivo) return '';
            if (nomeArquivo.startsWith('data:') || nomeArquivo.startsWith('blob:')) return nomeArquivo;
            if (nomeArquivo.startsWith(pasta + '/')) return nomeArquivo;
            const midias = window.DicionarioMidias || {};
            const fonte = midias[nomeArquivo];
            if (fonte) return fonte;
            return `${pasta}/${nomeArquivo}`;
        }

        function criarCard(item) {
            const card = document.createElement('div');
            card.className = 'card';
            card.id = `card-${item.ID || item.TERMO}`;

            let temImagem = false;
            let primeiraImagem = null;
            let temAudio = item.AUDIO ? true : false;
            let temVideo = false;

            if (item.SIGNIFICADOS && item.SIGNIFICADOS.length > 0) {
                item.SIGNIFICADOS.forEach(sig => {
                    if (sig.IMAGENS && sig.IMAGENS.length > 0) {
                        temImagem = true;
                        if (!primeiraImagem) primeiraImagem = sig.IMAGENS[0].ARQUIVO;
                    }
                    if (sig.VIDEOS && sig.VIDEOS.length > 0) temVideo = true;
                });
            }

            let html = `<div class="card-info">`;
            html += `<div class="card-lexical">${item.TERMO || '???'}</div>`;
            html += `<div class="card-traducao">${item.INDEX || ''}</div>`;
            if (item.CLASSE) html += `<span class="card-classe">${item.CLASSE}</span>`;
            html += `<div class="card-midia-indicador">`;
            if (temImagem) html += `<span>🖼️</span>`;
            if (temAudio) html += `<span>🔊</span>`;
            if (temVideo) html += `<span>🎥</span>`;
            html += `</div></div>`;

            if (primeiraImagem) {
                const src = resolverMidia(primeiraImagem, 'foto');
                html += `<div class="card-img-wrapper"><img src="${src}" alt="${item['ITEM_LEXICAL'] || ''}" loading="lazy"></div>`;
            }

            card.innerHTML = html;
            card.addEventListener('click', () => abrirModal(item));
            return card;
        }

        function criarItemLinear(item) {
            const container = document.createElement('div');
            container.className = 'entrada_lexical section level2';
            container.id = `item-${item.ID || item.TERMO}`;

            let html = `<span><span class='palavra_entrada'>${item.TERMO || '???'}</span>`;
            if (item.INDEX || item.CLASSE) {
                html += `<span class="entradalex"> `;
                if (item.INDEX) html += `[${item.INDEX}] `;
                if (item.CLASSE) html += `<i>${item.CLASSE}</i>`;
                html += `</span>`;
            }
            html += `</span><div class="entrada_div"><div class="info_entrada">`;

            if (item.AUDIO) {
                const srcAudio = resolverMidia(item.AUDIO, 'audio');
                html += `<br><audio preload="none" controls><source src="${srcAudio}" type="audio/mp3"></audio><br>`;
            }

            if (item.SIGNIFICADOS && item.SIGNIFICADOS.length > 0) {
                item.SIGNIFICADOS.forEach((sig, index) => {
                    html += `<div class="significado-item">`;
                    if (sig.TRADUCAO) html += `<strong>${index + 1}. ${sig.TRADUCAO}</strong><br>`;
                    if (sig.DESCRICAO) html += `<span class="texto-muted">${sig.DESCRICAO}</span><br>`;
                    if (sig.EXEMPLOS && sig.EXEMPLOS.length > 0) {
                        html += `<div style="margin-left: 16px; margin-top: 6px;">`;
                        sig.EXEMPLOS.forEach(ex => { html += `<em>${ex.TRANS}</em> - ${ex.TRAD}<br>`; });
                        html += `</div>`;
                    }
                    if (sig.IMAGENS && sig.IMAGENS.length > 0) {
                        html += `<div style="margin-top: 10px; display: flex; gap: 10px; flex-wrap: wrap;">`;
                        sig.IMAGENS.forEach(img => {
                            const srcImg = resolverMidia(img.ARQUIVO, 'foto');
                            html += `<img src="${srcImg}" style="max-height: 120px; border-radius: 8px; border: 1px solid var(--cor-borda); cursor: zoom-in;" onclick="abrirLightbox('${srcImg}')">`;
                        });
                        html += `</div>`;
                    }
                    if (sig.VIDEOS && sig.VIDEOS.length > 0) {
                        html += `<div style="margin-top: 10px; display: flex; gap: 10px; flex-wrap: wrap;">`;
                        sig.VIDEOS.forEach(vid => {
                            const srcVid = resolverMidia(vid.ARQUIVO, 'video');
                            html += `<video src="${srcVid}" controls style="max-height: 160px; border-radius: 8px; border: 1px solid var(--cor-borda);"></video>`;
                        });
                        html += `</div>`;
                    }
                    html += `</div>`;
                });
            }
            html += `</div></div>`;
            container.innerHTML = html;
            return container;
        }

        function renderizarCards(itens, limpar = false) {
            if (limpar) gridContainer.innerHTML = '';
            if (!itens || itens.length === 0) {
                gridContainer.innerHTML = `<div class="sem-resultados">
                    <div style="font-size: 3rem; margin-bottom: 16px;">🔍</div>
                    <h3>Nenhum item encontrado</h3>
                    <p>Tente ajustar os filtros ou o termo de busca.</p>
                </div>`;
                return;
            }
            const fragment = document.createDocumentFragment();
            itens.forEach(item => {
                fragment.appendChild(modoVisualizacao === 'cards' ? criarCard(item) : criarItemLinear(item));
            });
            gridContainer.appendChild(fragment);
        }

        function atualizarProgresso() {
            const total = dadosFiltrados.length;
            const exibidos = itensExibidos.length;
            contadorSpan.textContent = total;
            progressoDiv.textContent = `${exibidos}/${total} carregados`;
            if (exibidos < total) progressoDiv.textContent += ` (${total - exibidos} restantes)`;
        }

        // ==============================================
        // CARREGAMENTO PROGRESSIVO
        // ==============================================
        function carregarLoteFiltrado(quantidade = window.TAMANHO_LOTE) {
            if (carregandoDados || ultimoIndiceExibido >= dadosFiltrados.length) return;
            carregandoDados = true;
            const inicio = ultimoIndiceExibido;
            const fim = Math.min(inicio + quantidade, dadosFiltrados.length);
            const lote = dadosFiltrados.slice(inicio, fim);
            itensExibidos.push(...lote);
            ultimoIndiceExibido = fim;
            renderizarCards(lote, inicio === 0);
            atualizarProgresso();
            carregandoDados = false;
        }

        function setupIntersectionObserver() {
            const observer = new IntersectionObserver((entries) => {
                if (entries[0].isIntersecting && !carregandoDados && ultimoIndiceExibido < dadosFiltrados.length) {
                    carregarLoteFiltrado();
                }
            }, { rootMargin: '200px' });
            observer.observe(sentinela);
        }

        // ==============================================
        // FILTRAGEM E BUSCA
        // ==============================================
        function aplicarFiltrosEBusca() {
            const termo = termoBusca.toLowerCase();
            const semantico = filtroSemanticoValor;
            const classe = filtroClasseValor;
            const dicio = window.dadosDicionarioLexical || [];

            let resultados = dicio.filter(item => {
                const itemSemantico = item.CAMPO_SEMANTICO || '';
                if (semantico && itemSemantico !== semantico) return false;
                if (classe && item.CLASSE !== classe) return false;
                if (termo) {
                    const campos = [item.TERMO, item.INDEX, item.CLASSE, itemSemantico, item.SUB_CAMPO_SEMANTICO || ''];
                    if (item.SIGNIFICADOS) {
                        item.SIGNIFICADOS.forEach(sig => {
                            campos.push(sig.TRADUCAO);
                            campos.push(sig.DESCRICAO);
                        });
                    }
                    return campos.some(c => c && c.toString().toLowerCase().includes(termo));
                }
                return true;
            });

            if (ordenarPorTraducao) {
                resultados.sort((a, b) => (a.INDEX || '').localeCompare(b.INDEX || ''));
            }

            dadosFiltrados = resultados;
            itensExibidos = [];
            ultimoIndiceExibido = 0;
            gridContainer.innerHTML = '';
            carregarLoteFiltrado();

            if (modalOverlay.classList.contains('ativo') && itemAtualNoModal) {
                if (!resultados.includes(itemAtualNoModal)) fecharModal();
                else atualizarEstadoNavegacao();
            }
        }

        function inicializarFiltros() {
            const dicio = window.dadosDicionarioLexical || [];
            const semanticos = [...new Set(dicio.map(i => i.CAMPO_SEMANTICO).filter(Boolean))].sort();
            const classes = [...new Set(dicio.map(i => i.CLASSE).filter(Boolean))].sort();

            filtroSemantico.innerHTML = '<option value="">Todos os campos semânticos</option>';
            semanticos.forEach(s => {
                const opt = document.createElement('option');
                opt.value = s; opt.textContent = s;
                filtroSemantico.appendChild(opt);
            });

            filtroClasse.innerHTML = '<option value="">Todas as classes</option>';
            classes.forEach(c => {
                const opt = document.createElement('option');
                opt.value = c; opt.textContent = c;
                filtroClasse.appendChild(opt);
            });
        }

        searchButton.addEventListener('click', () => { termoBusca = searchInput.value; aplicarFiltrosEBusca(); });
        searchInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') { termoBusca = searchInput.value; aplicarFiltrosEBusca(); } });
        filtroSemantico.addEventListener('change', (e) => { filtroSemanticoValor = e.target.value; aplicarFiltrosEBusca(); });
        filtroClasse.addEventListener('change', (e) => { filtroClasseValor = e.target.value; aplicarFiltrosEBusca(); });
        ordenarTraducaoCheck.addEventListener('change', (e) => { ordenarPorTraducao = e.target.checked; aplicarFiltrosEBusca(); });

        // ==============================================
        // MODAL
        // ==============================================
        function abrirModal(item) {
            itemAtualNoModal = item;
            preencherModal(item);
            modalOverlay.classList.add('ativo');
            document.body.style.overflow = 'hidden';
            atualizarEstadoNavegacao();
        }

        function preencherModal(item) {
            modalTitulo.textContent = item.TERMO || 'Item';
            if (item.AUDIO) {
                const audioSrc = resolverMidia(item.AUDIO.split('~')[0].trim(), 'audio');
                modalAudioBtn.style.display = 'flex';
                modalAudioBtn.onclick = () => tocarAudio(audioSrc);
            } else {
                modalAudioBtn.style.display = 'none';
            }

            let html = '';
            html += `<div class="detalhe-secao"><div class="detalhe-titulo">ℹ️ Informações</div>`;
            if (item.INDEX) html += `<div class="detalhe-valor mb-2"><strong>Tradução/Significado:</strong> ${item.INDEX}</div>`;
            if (item.CLASSE) html += `<div class="detalhe-valor mb-2"><strong>Classe Gramatical:</strong> ${item.CLASSE}</div>`;
            if (item.CAMPO_SEMANTICO) html += `<div class="detalhe-valor mb-2"><strong>Campo Semântico:</strong> ${item.CAMPO_SEMANTICO}</div>`;
            if (item.SUB_CAMPO_SEMANTICO) html += `<div class="detalhe-valor mb-2"><strong>Subcampo:</strong> ${item.SUB_CAMPO_SEMANTICO}</div>`;
            html += `</div>`;

            if (item.FONEMICA || item.FONETICA) {
                html += `<div class="detalhe-secao"><div class="detalhe-titulo">🔤 Pronúncia</div>`;
                if (item.FONEMICA) html += `<div class="detalhe-valor mb-2"><strong>Fonêmica:</strong> ${item.FONEMICA}</div>`;
                if (item.FONETICA) html += `<div class="detalhe-valor"><strong>Fonética:</strong> ${item.FONETICA}</div>`;
                html += `</div>`;
            }

            if (item.AUDIO) {
                const audios = item.AUDIO.split('~').map(a => a.trim()).filter(Boolean);
                if (audios.length > 1) {
                    html += `<div class="detalhe-secao"><div class="detalhe-titulo">🔊 Áudios adicionais</div>`;
                    audios.slice(1).forEach(aud => {
                        const src = resolverMidia(aud.trim(), 'audio');
                        html += `<button class="audio-btn" onclick="tocarAudio('${src}')">▶ Ouvir</button>`;
                    });
                    html += `</div>`;
                }
            }

            if (item.SIGNIFICADOS && item.SIGNIFICADOS.length > 0) {
                html += `<div class="detalhe-secao"><div class="detalhe-titulo">📖 Significados</div>`;
                item.SIGNIFICADOS.forEach(sig => {
                    html += `<div class="exemplo-item" style="background:transparent; border:1px solid var(--cor-borda); padding:16px; margin-bottom:12px;">`;
                    if (sig.NUMERO) html += `<strong>${sig.NUMERO}. </strong>`;
                    if (sig.TRADUCAO) html += `<strong class="traducao">${sig.TRADUCAO}</strong><br>`;
                    if (sig.DESCRICAO) html += `<span style="color:rgba(62,58,50,0.7); display:block; margin-top:6px;">${sig.DESCRICAO}</span>`;

                    if (sig.EXEMPLOS && sig.EXEMPLOS.length > 0) {
                        html += `<div style="margin-top:12px;">`;
                        sig.EXEMPLOS.forEach(ex => {
                            html += `<div style="margin-bottom:8px; padding-left:12px; border-left:3px solid var(--cor-primaria);">`;
                            if (ex.TRANS) html += `<em style="color:var(--cor-texto);">${ex.TRANS}</em><br>`;
                            if (ex.TRAD) html += `<span style="color:rgba(62,58,50,0.6);">"${ex.TRAD}"</span>`;
                            html += `</div>`;
                        });
                        html += `</div>`;
                    }

                    if (sig.IMAGENS && sig.IMAGENS.length > 0) {
                        html += `<div class="midia-galeria" style="margin-top:12px;">`;
                        sig.IMAGENS.forEach(img => {
                            const src = resolverMidia(img.ARQUIVO, 'foto');
                            html += `<div class="midia-item"><img src="${src}" alt="${img.LEGENDA || ''}" loading="lazy">${img.LEGENDA ? `<div class="texto-muted" style="margin-top:6px; font-size:12px;">${img.LEGENDA}</div>` : ''}</div>`;
                        });
                        html += `</div>`;
                    }

                    if (sig.VIDEOS && sig.VIDEOS.length > 0) {
                        html += `<div class="midia-galeria" style="margin-top:12px;">`;
                        sig.VIDEOS.forEach(vid => {
                            const src = resolverMidia(vid.ARQUIVO, 'video');
                            html += `<div class="midia-item"><video controls><source src="${src}"></video></div>`;
                        });
                        html += `</div>`;
                    }

                    if (sig.EXTRAS && sig.EXTRAS.length > 0) {
                        html += `<div style="margin-top:12px; font-size:0.95em; color:rgba(62,58,50,0.7);">`;
                        sig.EXTRAS.forEach(ex => { html += `<div style="margin-bottom:6px;">${ex.TEXTO}</div>`; });
                        html += `</div>`;
                    }
                    html += `</div>`;
                });
                html += `</div>`;
            }

            if (item.ITENS_RELACIONADOS) {
                html += `<div class="detalhe-secao"><div class="detalhe-titulo">🔗 Relacionados</div>`;
                html += `<div class="detalhe-valor">${item.ITENS_RELACIONADOS}</div></div>`;
            }

            if (item.TEXTOS_ESTRUTURADOS && item.TEXTOS_ESTRUTURADOS.length > 0) {
                html += `<div class="detalhe-secao"><div class="detalhe-titulo">¶ Textos Adicionais</div>`;
                item.TEXTOS_ESTRUTURADOS.forEach(texto => {
                    if (texto.TITULO_BASE) html += `<h3 style="margin-bottom:12px; color:var(--cor-primaria); font-size:1.1rem;">${texto.TITULO_BASE}</h3>`;
                    if (texto.VARIACOES) {
                        texto.VARIACOES.forEach(variacao => {
                            if (variacao.FRASES) {
                                variacao.FRASES.forEach(frase => {
                                    html += `<div class="texto-frase">`;
                                    if (frase.ORIGINAL) html += `<div><strong>Original:</strong> ${frase.ORIGINAL}</div>`;
                                    if (frase.TRADUCAO) html += `<div class="texto-muted"><strong>Tradução:</strong> ${frase.TRADUCAO}</div>`;
                                    if (frase.AUDIO_ARQUIVO) {
                                        const src = resolverMidia(frase.AUDIO_ARQUIVO, 'audio');
                                        html += `<button class="audio-btn" style="margin-top:6px;" onclick="tocarAudio('${src}')">▶ Ouvir</button>`;
                                    }
                                    html += `</div>`;
                                });
                            }
                        });
                    }
                    if (texto.TEXTO_NAO_LITERAL) html += `<div class="mt-4" style="background:rgba(255,255,255,0.5); border-radius:var(--raio); padding:12px;">${texto.TEXTO_NAO_LITERAL}</div>`;
                });
                html += `</div>`;
            }
            modalBody.innerHTML = html;
        }

        function atualizarEstadoNavegacao() {
            if (!itemAtualNoModal) return;
            const idx = dadosFiltrados.indexOf(itemAtualNoModal);
            modalAnterior.disabled = (idx <= 0);
            modalProximo.disabled = (idx >= dadosFiltrados.length - 1);
        }

        function navegarModal(direcao) {
            if (!itemAtualNoModal) return;
            let idx = dadosFiltrados.indexOf(itemAtualNoModal);
            if (direcao === 'anterior' && idx > 0) idx--;
            else if (direcao === 'proximo' && idx < dadosFiltrados.length - 1) idx++;
            else return;
            itemAtualNoModal = dadosFiltrados[idx];
            preencherModal(itemAtualNoModal);
            atualizarEstadoNavegacao();
        }

        function fecharModal() {
            modalOverlay.classList.remove('ativo');
            document.body.style.overflow = '';
            itemAtualNoModal = null;
        }

        window.tocarAudio = function(src) {
            const audio = new Audio(src);
            audio.play().catch(e => console.warn('Erro ao tocar áudio:', e));
        };

        window.abrirLightbox = function(src) {
            lightboxImg.src = src;
            lightboxImg.alt = '';
            lightboxOverlay.classList.add('ativo');
        };

        modalFechar.addEventListener('click', fecharModal);
        modalOverlay.addEventListener('click', (e) => { if (e.target === modalOverlay) fecharModal(); });
        modalAnterior.addEventListener('click', () => navegarModal('anterior'));
        modalProximo.addEventListener('click', () => navegarModal('proximo'));

        const lightboxOverlay = document.getElementById('lightbox-overlay');
        const lightboxImg = document.getElementById('lightbox-img');
        document.getElementById('lightbox-fechar').addEventListener('click', () => lightboxOverlay.classList.remove('ativo'));
        lightboxOverlay.addEventListener('click', (e) => { if (e.target === lightboxOverlay) lightboxOverlay.classList.remove('ativo'); });
        modalBody.addEventListener('click', (e) => {
            if (e.target.tagName === 'IMG' && e.target.closest('.midia-item')) {
                lightboxImg.src = e.target.src;
                lightboxImg.alt = e.target.alt || '';
                lightboxOverlay.classList.add('ativo');
            }
        });

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                if (lightboxOverlay.classList.contains('ativo')) lightboxOverlay.classList.remove('ativo');
                else if (modalOverlay.classList.contains('ativo')) fecharModal();
            }
        });

        // ==============================================
        // INICIALIZAÇÃO
        // ==============================================
        document.addEventListener("DOMContentLoaded", () => {
            inicializarFiltros();
            dadosFiltrados = [...(window.dadosDicionarioLexical || [])];
            carregarLoteFiltrado();
            setupIntersectionObserver();
        });
    </script>
