plugins {
    id 'com.android.application'
}

android {
    namespace 'br.com.csv2dmli.dicionario'
    compileSdk 36

    // Pacote de recursos install-time para mídias acima do limite do módulo base (só no AAB)
    assetPacks = [":midia_pack"]

    defaultConfig {
        applicationId "br.com.csv2dmli.dicionario"
        minSdk 21
        targetSdk 36
        versionCode 1
        versionName "1.0"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    buildTypes {
        release {
            // Sem signingConfig — APK não assinado para ser assinado pelo Tauri via apksigner
            signingConfig null
            minifyEnabled false
            shrinkResources false
        }
    }
}
