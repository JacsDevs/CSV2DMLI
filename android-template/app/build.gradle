plugins {
    id 'com.android.application'
}

android {
    namespace 'br.com.csv2dmli.dicionario'
    compileSdk 36

    // Pacote de recursos usado como modelo pelo gerador, que o clona para cada pacote do plano
    // de entrega (install-time, fast-follow ou on-demand) — ver packages/android/injetorAab.js
    assetPacks = [":midia_pack"]

    defaultConfig {
        applicationId "br.com.csv2dmli.dicionario"
        minSdk 21
        targetSdk 36
        versionCode 1
        versionName "1.0"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    buildTypes {
        release {
            // Sem signingConfig — APK não assinado para ser assinado pelo Tauri via apksigner
            signingConfig null
            minifyEnabled false
            shrinkResources false
        }
    }
}

dependencies {
    // Play Asset Delivery: download dos pacotes de mídia fast-follow/on-demand (PonteMidias)
    implementation 'com.google.android.play:asset-delivery:2.2.2'
    // showConfirmationDialog tem uma sobrecarga com ActivityResultLauncher (activity 1.2+), que
    // precisa estar no classpath para compilar. O app usa a versão com Activity (MainActivity não é AndroidX).
    implementation 'androidx.activity:activity:1.2.4'
}
